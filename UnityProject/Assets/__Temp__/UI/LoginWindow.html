<div data-u-type="div" data-u-name="m_LoginWindow" style="width: 1920px; height: 1080px; background-color: #1a1a2ecc; display: flex; flex-direction: column; justify-content: center; align-items: center; padding: 0px; gap: 16px;">

    <!-- 标题 -->
    <span data-u-type="text" data-u-name="m_text_Title" style="color: #f0c060; font-size: 42px; text-align: center; margin-bottom: 24px;">登录</span>

    <!-- 显示名输入框 -->
    <div data-u-type="input" data-u-name="m_input_Account" placeholder="显示名（可选）" style="width: 320px; height: 48px; background-color: #0f3460; color: #e0e0e0; font-size: 20px;"></div>

    <!-- 密码输入框（隐藏） -->
    <div data-u-type="input" data-u-name="m_input_Password" placeholder="密码" style="width: 320px; height: 48px; background-color: #0f3460; color: #e0e0e0; font-size: 20px;"></div>

    <!-- 随机名称按钮 -->
    <button data-u-type="button" data-u-name="m_btn_RandomName" style="width: 320px; height: 48px; background-color: #1a3a5c; color: #78c0f0; font-size: 20px;">
        🎲 随机名称
    </button>

    <!-- 进入游戏按钮 -->
    <button data-u-type="button" data-u-name="m_btn_Login" style="width: 155px; height: 48px; background-color: #e94560; color: #ffffff; font-size: 20px;">
        进入游戏
    </button>

    <!-- 单机按钮 -->
    <button data-u-type="button" data-u-name="m_btn_Standalone" style="width: 155px; height: 48px; background-color: #1a3a5c; color: #a0c0e0; font-size: 20px;">
        单机
    </button>

</div>
